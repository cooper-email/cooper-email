[project]
name = "cooper-email"
version = "0.1.0"
description = "Official Python SDK for Cooper Email — HTTP email for AI agents (cooperemail.com)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Avatar 8 LLC", email = "ops@avatar33.com" }]
keywords = ["cooper-email", "email", "agents", "mcp", "inbox"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/cooper-email/cooper-email/tree/main/packages/cooper-email-python"
Documentation = "https://cooperemail.com/docs"
Website = "https://cooperemail.com"
Repository = "https://github.com/cooper-email/cooper-email"
Issues = "https://github.com/cooper-email/cooper-email/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cooper_email"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
