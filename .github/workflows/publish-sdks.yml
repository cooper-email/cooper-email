name: publish-sdks

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build:sdks
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --access public --provenance packages/cooper-email
          npm publish --access public --provenance packages/langchain
          npm publish --access public --provenance packages/ai
          npm publish --access public --provenance packages/mastra
          npm publish --access public --provenance packages/anthropic
          npm publish --access public --provenance packages/openai-agents
          npm publish --access public --provenance packages/n8n-nodes-cooper-email
          npm publish --access public --provenance packages/openapi

  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdists and wheels
        run: |
          python -m pip install -U build
          python -m build packages/cooper-email-python
          python -m build packages/langchain-py
          python -m build packages/llamaindex
          python -m build packages/crewai
          python -m build packages/openai-agents-py
          python -m build packages/anthropic-py
      - name: Publish cooper-email
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/cooper-email-python/dist
      - name: Publish cooper-email-langchain
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/langchain-py/dist
      - name: Publish cooper-email-llamaindex
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/llamaindex/dist
      - name: Publish cooper-email-crewai
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/crewai/dist
      - name: Publish cooper-email-openai-agents
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/openai-agents-py/dist
      - name: Publish cooper-email-anthropic
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/anthropic-py/dist
