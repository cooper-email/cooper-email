name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:sdks

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install SDKs
        run: |
          python -m pip install -U pip
          pip install -e "packages/cooper-email-python[dev]"
          pip install --no-deps \
            -e packages/langchain-py \
            -e packages/llamaindex \
            -e packages/crewai \
            -e packages/openai-agents-py \
            -e packages/anthropic-py
      - name: Test Python packages
        run: |
          python -m pytest --import-mode=importlib \
            packages/cooper-email-python \
            packages/langchain-py \
            packages/llamaindex \
            packages/crewai \
            packages/openai-agents-py \
            packages/anthropic-py
