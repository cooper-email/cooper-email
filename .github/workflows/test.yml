name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:sdks

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install SDKs
        run: |
          python -m pip install -U pip
          pip install -e "packages/cooper-email-python[dev]"
          pip install --no-deps \
            -e packages/langchain-py \
            -e packages/llamaindex \
            -e packages/crewai \
            -e packages/openai-agents-py \
            -e packages/anthropic-py
      - name: Test Python packages
        run: |
          python -m pytest --import-mode=importlib \
            packages/cooper-email-python \
            packages/langchain-py \
            packages/llamaindex \
            packages/crewai \
            packages/openai-agents-py \
            packages/anthropic-py
