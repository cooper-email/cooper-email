interface:
  display_name: "Agent Email Patterns"
  short_description: "Design how an agent uses email with Cooper"
  default_prompt: "Use $cooper-agent-email-patterns to plan how this agent should send and receive email."
dependencies:
  tools:
    - type: "mcp"
      value: "cooper-email"
      description: "Cooper Email hosted MCP server"
      transport: "streamable_http"
      url: "https://cooperemail.com/mcp"
policy:
  allow_implicit_invocation: true
