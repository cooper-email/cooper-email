interface:
  display_name: "Cooper MCP Setup"
  short_description: "Connect or troubleshoot the Cooper MCP server"
  default_prompt: "Use $cooper-mcp to connect the Cooper Email MCP server and sign in."
dependencies:
  tools:
    - type: "mcp"
      value: "cooper-email"
      description: "Cooper Email hosted MCP server"
      transport: "streamable_http"
      url: "https://cooperemail.com/mcp"
policy:
  allow_implicit_invocation: true
