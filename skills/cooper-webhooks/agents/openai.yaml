interface:
  display_name: "Webhooks"
  short_description: "Get pushed when mail arrives"
  default_prompt: "Use $cooper-webhooks to register a webhook for new mail on this inbox."
dependencies:
  tools:
    - type: "mcp"
      value: "cooper-email"
      description: "Cooper Email hosted MCP server"
      transport: "streamable_http"
      url: "https://cooperemail.com/mcp"
policy:
  allow_implicit_invocation: true
