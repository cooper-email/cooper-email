interface:
  display_name: "Send Email"
  short_description: "Send, reply, forward, or schedule email"
  default_prompt: "Use $cooper-send-email to prepare and send this message from my Cooper inbox."
dependencies:
  tools:
    - type: "mcp"
      value: "cooper-email"
      description: "Cooper Email hosted MCP server"
      transport: "streamable_http"
      url: "https://cooperemail.com/mcp"
policy:
  allow_implicit_invocation: true
